spring.application.name=wellnesstracker

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/wellnessDB
spring.datasource.username=postgres
spring.datasource.password=Admin1
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.defer-datasource-initialization=true

# Popola il DB con dati di test all'avvio
spring.sql.init.mode=always

# Spring Session JDBC
spring.session.store-type=none
#spring.session.jdbc.initialize-schema=always

# Actuator
management.endpoints.web.exposure.include=health

# Cookie
server.servlet.session.cookie.name=LABSESSIONCOOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false